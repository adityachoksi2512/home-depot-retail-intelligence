
name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform-checks:
    name: Terraform Validate and Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/environments/dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.8"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize for validation
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate -no-color

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        uses: google-github-actions/auth@v3
        with:
          project_id: hd-retail-intelligence-2026
          workload_identity_provider: projects/471733838600/locations/global/workloadIdentityPools/github-actions/providers/github-provider
          service_account: terraform-ci@hd-retail-intelligence-2026.iam.gserviceaccount.com

      - name: Initialize remote backend
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: terraform init -reconfigure -input=false

      - name: Terraform Plan
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: terraform plan -input=false -no-color
